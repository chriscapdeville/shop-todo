<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop Board</title>
<style>
  :root { --bg:#14161a; --card:#1e2228; --line:#2d333c; --text:#f2f4f7; --dim:#8d96a3; --accent:#e0a458; --free:#4cc38a; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow:hidden; }
  body { display:flex; flex-direction:column; padding:1.2vw 1.6vw; gap:1vw; }
  header { display:flex; align-items:baseline; justify-content:space-between; }
  h1 { margin:0; font-size:2.4vw; letter-spacing:.04em; font-weight:700; }
  #clock { font-size:2vw; color:var(--dim); font-variant-numeric: tabular-nums; }
  #free { display:none; background:rgba(76,195,138,.14); border:2px solid var(--free); color:var(--free);
    border-radius:1vw; padding:.8vw 1.4vw; font-size:2.2vw; font-weight:700; }
  #free.show { display:block; }
  #grid { flex:1; min-height:0; display:grid; gap:1vw;
    grid-template-columns: repeat(var(--cols, 4), minmax(0, 1fr)); grid-auto-rows: minmax(0, 1fr); }
  .col { background:var(--card); border:1px solid var(--line); border-radius:1vw; padding:1vw 1.2vw;
    display:flex; flex-direction:column; min-height:0; overflow:hidden; }
  .col.idle { border-color:var(--free); box-shadow:0 0 0 2px rgba(76,195,138,.25) inset; }
  .name { font-size:calc(2.2vw * var(--s, 1)); font-weight:700; display:flex; justify-content:space-between; align-items:baseline;
    border-bottom:1px solid var(--line); padding-bottom:.5vw; margin-bottom:.6vw; }
  .count { font-size:calc(1.5vw * var(--s, 1)); color:var(--dim); font-weight:500; }
  .tasks { flex:1; min-height:0; overflow:hidden; }
  .task { font-size:calc(1.8vw * var(--s, 1)); line-height:1.25; padding:.4vw .6vw; margin-bottom:.35vw; border-radius:.5vw;
    border-left:.5vw solid var(--pc, transparent); background:var(--pb, transparent); }
  .task.p0 { --pc:#5b9bd5; --pb:rgba(91,155,213,.10); color:#b9d3ee; }
  .task.p2 { --pc:#e0a458; --pb:rgba(224,164,88,.14); }
  .task.p3 { --pc:#ff5d5d; --pb:rgba(255,93,93,.18); font-weight:600; }
  .badge { display:inline-block; font-size:calc(1.05vw * var(--s, 1)); font-weight:800; letter-spacing:.06em; padding:.1vw .5vw;
    border-radius:.4vw; margin-right:.5vw; vertical-align:.15vw; color:#14161a; background:var(--pc, #888); }
  .badge.flag { background:#d94fd5; color:#fff; }
  .task.flag { border-left-color:#d94fd5; animation: flash 1.1s ease-in-out infinite; }
  @keyframes flash {
    0%, 100% { background:rgba(217,79,213,.10); box-shadow:0 0 0 0 rgba(217,79,213,0); }
    50%      { background:rgba(217,79,213,.50); box-shadow:0 0 1.2vw .2vw rgba(217,79,213,.7); }
  }
  .need { display:block; font-size:calc(1.3vw * var(--s, 1)); color:#f0b6ee; font-weight:600; margin-top:.15vw; }
  #attn { display:none; background:rgba(217,79,213,.2); border:2px solid #d94fd5; color:#f6c9f4;
    border-radius:1vw; padding:.7vw 1.4vw; font-size:2vw; font-weight:800; animation: flash 1.1s ease-in-out infinite; }
  #attn.show { display:block; }
  .legend { font-size:1.1vw; color:var(--dim); display:flex; gap:1.2vw; align-items:center; }
  .legend i { display:inline-block; width:.9vw; height:.9vw; border-radius:.2vw; margin-right:.3vw; vertical-align:-.05vw; }
  @media (prefers-reduced-motion: reduce) { .task.flag, #attn { animation:none; background:rgba(217,79,213,.35); } }
  .note { display:block; font-size:calc(1.25vw * var(--s, 1)); color:var(--dim); font-weight:400; margin-top:.15vw; }
  .priv { font-size:calc(1.5vw * var(--s, 1)); color:var(--dim); padding:.45vw 0; font-style:italic; }
  .none { font-size:calc(2vw * var(--s, 1)); color:var(--free); font-weight:700; margin-top:1vw; }
  .more { font-size:calc(1.4vw * var(--s, 1)); color:var(--dim); }
  #stale { position:fixed; right:1.6vw; bottom:1vw; font-size:1.2vw; color:#ff7a7a; display:none; }
</style>
</head>
<body>
<header>
  <h1>SHOP BOARD</h1>
  <div id="clock"></div>
</header>
<div id="attn"></div>
<div id="free"></div>
<div id="grid"></div>
<div class="legend">
  <span><i style="background:#ff5d5d"></i>Urgent</span><span><i style="background:#e0a458"></i>High</span>
  <span><i style="background:#8d96a3"></i>Normal</span><span><i style="background:#5b9bd5"></i>Low</span>
  <span><i style="background:#d94fd5"></i>Flashing = needs info, material or a manager</span>
</div>
<div id="stale">Connection lost — retrying…</div>

<script>
const key = new URLSearchParams(location.search).get('key') || '';
const grid = document.getElementById('grid');
const freeBar = document.getElementById('free');
const stale = document.getElementById('stale');
const MAX_TASKS = 8; // per column, so nothing needs scrolling on a TV
const FLAG_LABEL = { info: 'NEED INFO', material: 'NEED MATERIAL', manager: 'NEED MANAGER' };

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function render(data) {
  const people = data.people;
  const n = Math.max(people.length, 1);
  // One row, every name across the top; wraps to two rows only past 10 people. Text shrinks as columns get narrower.
  const cols = n <= 10 ? n : Math.ceil(n / 2);
  grid.style.setProperty('--cols', cols);
  grid.style.setProperty('--s', n <= 4 ? 1 : n <= 6 ? 0.85 : n <= 8 ? 0.7 : 0.6);
  grid.replaceChildren();
  const idle = [];
  for (const p of people) {
    const busy = p.tasks.length + p.private_count;
    const col = el('div', 'col' + (busy === 0 ? ' idle' : ''));
    const head = el('div', 'name');
    head.append(el('span', '', p.name), el('span', 'count', busy ? `${busy} open` : (p.done_today ? `${p.done_today} done today` : '')));
    col.append(head);
    const list = el('div', 'tasks');
    if (busy === 0) {
      idle.push(p.name);
      list.append(el('div', 'none', 'Free — jump in!'));
    }
    p.tasks.slice(0, MAX_TASKS).forEach((t) => {
      const row = el('div', 'task p' + t.priority + (t.flag ? ' flag' : ''));
      if (t.flag) row.append(el('span', 'badge flag', FLAG_LABEL[t.flag]));
      else if (t.priority === 3) row.append(el('span', 'badge', 'URGENT'));
      else if (t.priority === 2) row.append(el('span', 'badge', 'HIGH'));
      row.append(document.createTextNode(t.title));
      if (t.flag && t.flag_text) row.append(el('span', 'need', t.flag_text));
      if (t.note) row.append(el('span', 'note', t.note));
      list.append(row);
    });
    if (p.tasks.length > MAX_TASKS) list.append(el('div', 'more', `+${p.tasks.length - MAX_TASKS} more`));
    if (p.private_count) list.append(el('div', 'priv', `+ ${p.private_count} private`));
    col.append(list);
    grid.append(col);
  }
  const attn = document.getElementById('attn');
  if (data.attention) { attn.textContent = `${data.attention} task${data.attention > 1 ? 's' : ''} need attention`; attn.classList.add('show'); }
  else attn.classList.remove('show');
  if (idle.length) { freeBar.textContent = 'Free to help: ' + idle.join(', '); freeBar.classList.add('show'); }
  else freeBar.classList.remove('show');
}

async function tick() {
  try {
    const r = await fetch('/api/tv?key=' + encodeURIComponent(key), { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    render(await r.json());
    stale.style.display = 'none';
  } catch { stale.style.display = 'block'; }
}
function clock() {
  document.getElementById('clock').textContent =
    new Date().toLocaleString([], { weekday: 'long', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
}
tick(); clock();
setInterval(tick, 10000);
setInterval(clock, 15000);
// TVs sleep; reload once a night to pick up any new code
setTimeout(() => location.reload(), 6 * 3600 * 1000);
</script>
</body>
</html>
